name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        required: false
        type: boolean
        description: Publish a new release
        default: false
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_is_release: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: "Set up JDK 25"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 25
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: "Build & Test"
        id: build
        run: |
          # Pin the time for CalVer
          timestamp="$(date +%s)"
          echo "ORG_GRADLE_PROJECT_build_timestamp=$timestamp" >> "$GITHUB_ENV"
          export ORG_GRADLE_PROJECT_build_timestamp="$timestamp"
          
          # We run tests and compile but bypass static analysis/checks like Spotless
          ./gradlew build -x spotlessCheck
          
          # Export the version
          version="$(./gradlew properties -q | grep '^version:' | cut -d ':' -f 2 | xargs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"


      - name: "Format Code"
        if: ${{ github.event_name != 'pull_request' }}
        run: ./gradlew spotlessApply

      - name: "Commit Formatted Code"
        if: ${{ github.event_name != 'pull_request' }}
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "style: Format Code"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/

      - name: "Upload Mindustry Jar"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: "imperium-mindustry/build/libs/imperium-mindustry.jar"
          archive: false
          if-no-files-found: error

      - name: "Upload Backend Jar"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: "imperium-backend/build/libs/imperium-backend.jar"
          archive: false
          if-no-files-found: error

      - name: "Create Release"
        if: ${{ env.ORG_GRADLE_PROJECT_is_release == 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "Build v${{ steps.build.outputs.version }}"
          tag_name: "v${{ steps.build.outputs.version }}"
          files: |
            imperium-mindustry/build/libs/imperium-mindustry.jar
            imperium-backend/build/libs/imperium-backend.jar

      - name: "Bump Version"
        if: ${{ env.ORG_GRADLE_PROJECT_is_release == 'true' }}
        run: echo "${{ steps.build.outputs.version }}" > VERSION.txt

      - name: "Post Build Changes"
        if: ${{ github.event_name != 'pull_request' }}
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conditionally formats the commit message depending on whether a release occurred
          commit_message: "${{ env.ORG_GRADLE_PROJECT_is_release == 'true' && format('chore: Post v{0} changes and format', steps.build.outputs.version) || 'style: Format code' }}"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}

  event-file:
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    name: "Event File"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:

      - name: "Upload Event File"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: event-file
          path: ${{ github.event_path }}
